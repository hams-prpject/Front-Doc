<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة مراجعة أسئلة Front-End التفاعلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --code-bg: #090d16;
            --code-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.8;
            padding: 30px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            padding: 25px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 2.1rem;
            color: #60a5fa;
            margin-bottom: 8px;
            font-weight: 900;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 18px 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            background: #0f172a;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: #334155;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: #475569;
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px 25px;
            margin-bottom: 22px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .q-number {
            font-weight: 900;
            color: #38bdf8;
            font-size: 1rem;
        }

        .cat-badge {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .cat-html {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .cat-css {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .cat-bootstrap {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .cat-tailwind {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .cat-js {
            background: rgba(234, 179, 8, 0.2);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .q-title {
            font-size: 1.12rem;
            font-weight: 700;
            margin-bottom: 18px;
            color: #f1f5f9;
            line-height: 1.7;
        }

        .code-snippet {
            direction: ltr;
            display: inline-block;
            background: var(--code-bg);
            color: var(--code-color);
            padding: 2px 8px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95em;
            border: 1px solid #1e293b;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.98rem;
            cursor: pointer;
            text-align: right;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-btn:hover {
            border-color: var(--accent);
            background: #172554;
        }

        .opt-letter {
            min-width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #1e293b;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .opt-text {
            flex-grow: 1;
            text-align: right;
            direction: ltr;
        }

        /* Feedback States */
        .option-btn.correct {
            background: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: #34d399 !important;
            font-weight: 700;
        }

        .option-btn.correct .opt-letter {
            background: var(--success) !important;
            color: #fff !important;
            border-color: var(--success) !important;
        }

        .option-btn.wrong {
            background: var(--danger-bg) !important;
            border-color: var(--danger) !important;
            color: #f87171 !important;
        }

        .option-btn.wrong .opt-letter {
            background: var(--danger) !important;
            color: #fff !important;
            border-color: var(--danger) !important;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.92rem;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .feedback-box.correct-fb {
            display: flex;
            background: var(--success-bg);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .feedback-box.wrong-fb {
            display: flex;
            background: var(--danger-bg);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .search-box {
            width: 100%;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        footer {
            text-align: center;
            padding: 25px;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 40px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>

<body>
    <div class="container">
        <header style="margin-bottom: 0;">
            <h1><i class="fas fa-chalkboard-teacher"></i> صفحة مراجعة أسئلة Front-End التفاعلية</h1>
            <p>ملف مراجعة مخصص للشرح والعرض أمام الطلاب (HTML, CSS, Bootstrap, Tailwind, JS)</p>
        </header>

        <div class="search-box" style="opacity: 0; height: 0; overflow: hidden; display: none;">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث في نص السؤال أو الخيارات..."
                oninput="filterQuestions()">
        </div>

        <div class="controls-bar" style="opacity: 0; height: 0; overflow: hidden; margin-bottom: 0;">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setCategory('all', this)">الكل (<span
                        id="count-all">0</span>)</button>
                <button class="filter-btn" onclick="setCategory('html', this)">HTML (<span
                        id="count-html">0</span>)</button>
                <button class="filter-btn" onclick="setCategory('css', this)">CSS (<span
                        id="count-css">0</span>)</button>
                <button class="filter-btn" onclick="setCategory('bootstrap', this)">Bootstrap (<span
                        id="count-bootstrap">0</span>)</button>
                <button class="filter-btn" onclick="setCategory('tailwind', this)">Tailwind (<span
                        id="count-tailwind">0</span>)</button>
                <button class="filter-btn" onclick="setCategory('js', this)">JavaScript (<span
                        id="count-js">0</span>)</button>
            </div>
            <div class="action-btns">
                <button class="btn-action" onclick="resetAll()"><i class="fas fa-rotate-right"></i> إعادة
                    التعيين</button>
            </div>
        </div>

        <div id="questionsContainer"></div>

        <footer>
            <p>تم تصميم هذا الملف للعرض والمراجعة المباشرة مع الطلاب دون توقيت أو درجات</p>
        </footer>
    </div>

        let currentCategory = 'all';

        function escapeHTML(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatCodeText(text) {
            let safe = escapeHTML(text);
            return safe.replace(/(&lt;[^&]+&gt;|[a-zA-Z0-9_$-]+\s*:\s*[^;&]+|console\.log\([^)]+\)|[a-zA-Z0-9_$-]+\([^)]*\)|[a-zA-Z0-9_$-]+="[^"]*")/g, function (match) {
                return '<span class="code-snippet">' + match + '</span>';
            });
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            let counts = { all: 0, html: 0, css: 0, bootstrap: 0, tailwind: 0, js: 0 };
            const letters = ['أ', 'ب', 'ج', 'د'];
            const catNames = { html: 'HTML', css: 'CSS', bootstrap: 'Bootstrap', tailwind: 'Tailwind CSS', js: 'JavaScript' };

            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

            rawQuestions.forEach((q, index) => {
                counts.all++;
                if (counts[q[3]] !== undefined) counts[q[3]]++;

                if (currentCategory !== 'all' && q[3] !== currentCategory) return;
                if (searchVal && !q[0].toLowerCase().includes(searchVal) && !q[1].some(opt => opt.toLowerCase().includes(searchVal))) return;

                const qCard = document.createElement('div');
                qCard.className = 'question-card';
                qCard.id = `q-card-${index}`;

                let optionsHTML = '';
                q[1].forEach((opt, optIdx) => {
                    optionsHTML += `
                        <div class="option-btn" onclick="checkAnswer(${index}, ${optIdx})" id="opt-${index}-${optIdx}">
                            <span class="opt-letter">${letters[optIdx]}</span>
                            <span class="opt-text">${formatCodeText(opt)}</span>
                        </div>
                    `;
                });

                qCard.innerHTML = `
                    <div class="q-header">
                        <span class="q-number">سؤال #${index + 1}</span>
                        <span class="cat-badge cat-${q[3]}">${catNames[q[3]]}</span>
                    </div>
                    <div class="q-title">${formatCodeText(q[0])}</div>
                    <div class="options-grid" id="options-grid-${index}">
                        ${optionsHTML}
                    </div>
                    <div class="feedback-box" id="feedback-${index}"></div>
                `;

                container.appendChild(qCard);
            });

            for (let c in counts) {
                const el = document.getElementById(`count-${c}`);
                if (el) el.textContent = counts[c];
            }
        }

        function checkAnswer(qIdx, selectedOptIdx) {
            const qData = rawQuestions[qIdx];
            const correctOptIdx = qData[2];
            const letters = ['أ', 'ب', 'ج', 'د'];

            qData[1].forEach((_, idx) => {
                const btn = document.getElementById(`opt-${qIdx}-${idx}`);
                btn.classList.remove('correct', 'wrong');

                if (idx === correctOptIdx) {
                    btn.classList.add('correct');
                } else if (idx === selectedOptIdx) {
                    btn.classList.add('wrong');
                }
            });

            const fbBox = document.getElementById(`feedback-${qIdx}`);
            const correctText = qData[1][correctOptIdx];

            if (selectedOptIdx === correctOptIdx) {
                fbBox.className = 'feedback-box correct-fb';
                fbBox.innerHTML = `<i class="fas fa-check-circle"></i> إجابة صحيحة! (${letters[correctOptIdx]}) ${formatCodeText(correctText)}`;
            } else {
                fbBox.className = 'feedback-box wrong-fb';
                fbBox.innerHTML = `<i class="fas fa-times-circle"></i> إجابة خاطئة! الإجابة الصحيحة هي (${letters[correctOptIdx]}): ${formatCodeText(correctText)}`;
            }
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderQuestions();
        }

        function filterQuestions() {
            renderQuestions();
        }

        function resetAll() {
            document.getElementById('searchInput').value = '';
            renderQuestions();
        }

        renderQuestions();
    </script>
